name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and lint Lean project
        uses: leanprover/lean-action@v1
      - name: Build and publish API documentation
        uses: leanprover-community/docgen-action@v1
